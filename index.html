<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worldwide Lottery Speech Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2 id="title-text">Lottery Speech Analyzer V.522261320</h2>
    <div class="settings-row">
        <label for="lang-select">Language:</label>
        <select id="lang-select">
            <option value="en-US">English</option>
            <option value="pt-BR">Portuguese</option>
            <option value="fr-FR">French</option>
            <option value="es-ES">Spanish</option>
            <option value="it-IT">Italian</option>
            <option value="de-DE">German</option>
            <option value="ko-KR">Korean</option>
            <option value="zh-CN">Chinese (Mandarin)</option>
        </select>
    </div>
    <div class="controls">
        <button id="start-btn">Start<span id="start-sub"></span></button>
        <button id="analyze-btn">Analyze<span id="analyze-sub"></span></button>
        <button id="clear-btn">Clear<span id="clear-sub"></span></button>
    </div>
    <textarea id="output-text" placeholder="Speak your lottery numbers..."></textarea>
    <div id="verify-box">
        <p id="confirm-text" style="font-weight: 600; color: #0056b3;">I recognized these numbers. Are they correct?</p>
        <div id="number-display"></div>
        <div class="choice-btns">
            <button id="yes-btn">YES</button>
            <button id="no-btn">NO</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
