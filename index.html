<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lottery Data Analyzer</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; background-color: #f0f2f5; }
        .container { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 600px; text-align: center; }
        .controls { margin-bottom: 1rem; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        
        button { padding: 12px 20px; font-size: 1rem; border: none; border-radius: 8px; cursor: pointer; color: white; transition: 0.2s; }
        #start-btn { background-color: #28a745; }
        #analyze-btn { background-color: #007bff; }
        #clear-btn { background-color: #6c757d; }
        
        button.listening { background-color: #dc3545; animation: pulse 1.5s infinite; }
        textarea { width: 100%; height: 120px; padding: 15px; border: 2px solid #ddd; border-radius: 10px; box-sizing: border-box; margin-bottom: 1rem; }

        /* Verification Box */
        #verify-box { 
            display: none; margin-top: 20px; padding: 20px; border: 2px solid #007bff; 
            border-radius: 10px; background: #e7f1ff; text-align: center; 
        }
        .num-tag { display: inline-block; background: #007bff; color: white; padding: 5px 10px; margin: 5px; border-radius: 5px; font-weight: bold; }
        .choice-btns { margin-top: 15px; display: flex; gap: 20px; justify-content: center; }
        #yes-btn { background-color: #28a745; }
        #no-btn { background-color: #dc3545; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <h2>Lottery Speech Analyzer</h2>
    <div class="controls">
        <button id="start-btn">Start Listening</button>
        <button id="analyze-btn">Analyze Speech</button>
        <button id="clear-btn">Clear</button>
    </div>
    
    <textarea id="output-text" placeholder="Speak numbers (e.g. 'My numbers are 12, 24, and 35')"></textarea>

    <!-- Verification Section -->
    <div id="verify-box">
        <p>I recognized these numbers. Are they correct?</p>
        <div id="number-display"></div>
        <div class="choice-btns">
            <button id="yes-btn">YES, Check Lottery</button>
            <button id="no-btn">NO, Edit Text</button>
        </div>
    </div>
</div>

<script>
    const startBtn = document.getElementById('start-btn');
    const analyzeBtn = document.getElementById('analyze-btn');
    const clearBtn = document.getElementById('clear-btn');
    const outputText = document.getElementById('output-text');
    const verifyBox = document.getElementById('verify-box');
    const numberDisplay = document.getElementById('number-display');
    const yesBtn = document.getElementById('yes-btn');
    const noBtn = document.getElementById('no-btn');

    let recognizedNumbers = [];

// --- Speech Recognition Setup ---
const SpeechRecognition = window.webkitSpeechRecognition || window.SpeechRecognition;
const recognition = new SpeechRecognition();

recognition.continuous = true;
recognition.interimResults = true; // This is the magic key
recognition.lang = 'en-US';

let finalTranscript = ''; // Stores everything confirmed so far

startBtn.onclick = () => {
    if (startBtn.classList.contains('listening')) {
        recognition.stop();
    } else {
        // Clear previous session data when starting fresh
        finalTranscript = outputText.value; 
        recognition.start();
    }
};

recognition.onresult = (event) => {
    let interimTranscript = '';

    for (let i = event.resultIndex; i < event.results.length; ++i) {
        if (event.results[i].isFinal) {
            // Add to the permanent record
            finalTranscript += event.results[i][0].transcript + " ";
        } else {
            // Store the "live guess"
            interimTranscript += event.results[i][0].transcript;
        }
    }

    // Update the textarea: Confirmed text + the live guess
    outputText.value = finalTranscript + interimTranscript;
    
    // Keep the view scrolled to the bottom
    outputText.scrollTop = outputText.scrollHeight;
};

recognition.onend = () => {
    startBtn.textContent = 'Start Listening';
    startBtn.classList.remove('listening');
    // Save the final state to the variable
    finalTranscript = outputText.value;
};
    recognition.onresult = (event) => {
        let transcript = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
            transcript += event.results[i][0].transcript;
        }
        outputText.value += transcript.trim() + " ";
    };

    // --- Analysis Logic ---
    analyzeBtn.onclick = () => {
        const text = outputText.value;
        // This Regex finds all numbers in the text
        const matches = text.match(/\d+/g); 
        
        if (matches && matches.length > 0) {
            recognizedNumbers = matches;
            numberDisplay.innerHTML = "";
            recognizedNumbers.forEach(num => {
                numberDisplay.innerHTML += `<span class="num-tag">${num}</span>`;
            });
            verifyBox.style.display = 'block';
        } else {
            alert("No numbers found in the speech!");
        }
    };

    // --- Choice Logic ---
    yesBtn.onclick = () => {
        alert("Proceeding to check lottery database with: " + recognizedNumbers.join(", "));
        // Here is where your JSON matching logic will go tomorrow!
    };

    noBtn.onclick = () => {
        verifyBox.style.display = 'none';
        outputText.focus(); // Set focus back to text area for editing
    };

    clearBtn.onclick = () => {
        outputText.value = '';
        verifyBox.style.display = 'none';
    };
</script>

</body>
</html>
