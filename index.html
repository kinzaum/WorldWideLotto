<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worldwide Lottery Speech Analyzer</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px; 
            background-color: #f0f2f5; 
            margin: 0;
        }
        .container { 
            background: white; 
            padding: 2rem; 
            border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            width: 95%; 
            max-width: 650px; 
            text-align: center; 
        }
        h2 { color: #333; margin-bottom: 1.5rem; }
        
        .settings-row {
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 2px solid #ddd;
            font-size: 1rem;
            outline: none;
            cursor: pointer;
        }

        .controls { 
            margin-bottom: 1.5rem; 
            display: flex; 
            gap: 10px; 
            justify-content: center; 
            flex-wrap: wrap; 
        }
        
        button { 
            padding: 10px 20px; 
            font-size: 1rem; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            color: white; 
            font-weight: 600;
            transition: all 0.2s ease; 
            min-width: 140px;
            line-height: 1.2;
        }
        
        /* The sub-label style */
        button span {
            display: block;
            font-size: 0.75rem;
            font-weight: 400;
            opacity: 0.9;
            margin-top: 2px;
        }

        #start-btn { background-color: #28a745; }
        #analyze-btn { background-color: #007bff; }
        #clear-btn { background-color: #6c757d; }
        
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button.listening { 
            background-color: #dc3545; 
            animation: pulse 1.5s infinite; 
        }
        
        textarea { 
            width: 100%; 
            height: 150px; 
            padding: 15px; 
            border: 2px solid #ddd; 
            border-radius: 10px; 
            box-sizing: border-box; 
            margin-bottom: 1rem; 
            font-size: 1.1rem;
            line-height: 1.5;
            resize: vertical;
        }

        #verify-box { 
            display: none; 
            margin-top: 20px; 
            padding: 20px; 
            border: 2px solid #007bff; 
            border-radius: 12px; 
            background: #e7f1ff; 
            text-align: center; 
        }
        .num-tag { 
            display: inline-block; 
            background: #007bff; 
            color: white; 
            padding: 8px 14px; 
            margin: 5px; 
            border-radius: 6px; 
            font-weight: bold; 
            font-size: 1.2rem;
        }
        .choice-btns { 
            margin-top: 20px; 
            display: flex; 
            gap: 15px; 
            justify-content: center; 
        }
        #yes-btn { background-color: #28a745; }
        #no-btn { background-color: #dc3545; }

        @keyframes pulse { 
            0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.4); } 
            70% { box-shadow: 0 0 0 10px rgba(220, 53, 69, 0); } 
            100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); } 
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Lottery Speech Analyzer</h2>
    
    <div class="settings-row">
        <label for="lang-select">Language:</label>
        <select id="lang-select">
            <option value="en-US">English</option>
            <option value="pt-BR">Portuguese</option>
            <option value="fr-FR">French</option>
            <option value="es-ES">Spanish</option>
            <option value="it-IT">Italian</option>
            <option value="de-DE">German</option>
            <option value="ko-KR">Korean</option>
            <option value="zh-CN">Chinese (Mandarin)</option>
        </select>
    </div>

    <div class="controls">
        <button id="start-btn">Start Listening<span id="start-sub"></span></button>
        <button id="analyze-btn">Analyze Speech<span id="analyze-sub"></span></button>
        <button id="clear-btn">Clear<span id="clear-sub"></span></button>
    </div>
    
    <textarea id="output-text" placeholder="Speak your lottery numbers..."></textarea>

    <div id="verify-box">
        <p style="font-weight: 600; color: #0056b3;">I recognized these numbers. Are they correct?</p>
        <div id="number-display"></div>
        <div class="choice-btns">
            <button id="yes-btn">YES, Check Lottery</button>
            <button id="no-btn">NO, Edit Text</button>
        </div>
    </div>
</div>

<script>
    const startBtn = document.getElementById('start-btn');
    const analyzeBtn = document.getElementById('analyze-btn');
    const clearBtn = document.getElementById('clear-btn');
    const outputText = document.getElementById('output-text');
    const verifyBox = document.getElementById('verify-box');
    const numberDisplay = document.getElementById('number-display');
    const yesBtn = document.getElementById('yes-btn');
    const noBtn = document.getElementById('no-btn');
    const langSelect = document.getElementById('lang-select');
    const startSub = document.getElementById('start-sub');
    const analyzeSub = document.getElementById('analyze-sub');
    const clearSub = document.getElementById('clear-sub');

    // Secure Cloud Architecture Variables
    const API_URL = "https://script.google.com/macros/s/AKfycbwMApjBhxoBJct7tAy6hEHk0PuOtCUIBgozwtWJKRhhtmRotZ7gLcazcEraf8dsyz6srw/exec";
    let recognizedNumbers = [];
    let finalTranscript = ''; 

    // Store a pristine copy of the original confirmation block structure
    const originalVerifyHTML = verifyBox.innerHTML;

    // Helper to restore the original confirmation screen elements
    function resetVerifyBoxToDefault() {
        verifyBox.innerHTML = originalVerifyHTML;
        bindChoiceButtons();
    }

    const translations = {
        "en-US": { start: "", analyze: "", clear: "" },
        "pt-BR": { start: "Começar a Ouvir", analyze: "Analisar Fala", clear: "Limpar" },
        "fr-FR": { start: "Commencer à écouter", analyze: "Analyser la parole", clear: "Effacer" },
        "es-ES": { start: "Empezar a escuchar", analyze: "Analizar voz", clear: "Borrar" },
        "it-IT": { start: "Inizia ad ascoltare", analyze: "Analizza il discorso", clear: "Cancella" },
        "de-DE": { start: "Zuhören starten", analyze: "Sprache analysieren", clear: "Löschen" },
        "ko-KR": { start: "듣기 시작", analyze: "음성 분석", clear: "지우기" },
        "zh-CN": { start: "开始倾听", analyze: "语音 analysis", clear: "清除" }
    };

    function updateButtonLabels() {
        const lang = langSelect.value;
        const t = translations[lang];
        
        analyzeSub.textContent = t.analyze;
        clearSub.textContent = t.clear;

        if (startBtn.classList.contains('listening')) {
            startBtn.childNodes[0].textContent = "Stop Listening ";
            startSub.textContent = lang === 'en-US' ? '' : 'Stop';
        } else {
            startBtn.childNodes[0].textContent = "Start Listening ";
            startSub.textContent = t.start;
        }
    }

    const SpeechRecognition = window.webkitSpeechRecognition || window.SpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true; 
    recognition.lang = langSelect.value;

    langSelect.onchange = () => {
        recognition.lang = langSelect.value;
        updateButtonLabels();
        if (startBtn.classList.contains('listening')) {
            recognition.stop();
            setTimeout(() => recognition.start(), 200);
        }
    };

    startBtn.onclick = () => {
        if (startBtn.classList.contains('listening')) {
            recognition.stop();
        } else {
            finalTranscript = outputText.value; 
            recognition.start();
        }
    };

    recognition.onstart = () => {
        startBtn.classList.add('listening');
        updateButtonLabels();
        verifyBox.style.display = 'none';
    };

    recognition.onend = () => {
        startBtn.classList.remove('listening');
        updateButtonLabels();
        finalTranscript = outputText.value;
    };

    recognition.onresult = (event) => {
        let interimTranscript = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) {
                finalTranscript += event.results[i][0].transcript + " ";
            } else {
                interimTranscript += event.results[i][0].transcript;
            }
        }
        outputText.value = finalTranscript + interimTranscript;
        outputText.scrollTop = outputText.scrollHeight;
    };

    analyzeBtn.onclick = () => {
        const text = outputText.value;
        const matches = text.match(/\d+/g); 
        if (matches && matches.length > 0) {
            recognizedNumbers = [...new Set(matches.map(Number))]; // Remove duplicates
            
            // Revert back to the pristine YES/NO question screen
            resetVerifyBoxToDefault();

            // Populate the number display on the restored element
            const currentNumberDisplay = document.getElementById('number-display');
            currentNumberDisplay.innerHTML = "";
            recognizedNumbers.forEach(num => {
                currentNumberDisplay.innerHTML += `<span class="num-tag">${num}</span>`;
            });
            
            verifyBox.style.display = 'block';
        } else {
            alert("No numbers found!");
        }
    };

    // SECURE REMOTE SEARCH LOGIC VIA GOOGLE APPS SCRIPT WEB API
    const handleYesClick = () => {
        // Show a loading UI indicator inside the panel during cloud computation
        verifyBox.innerHTML = `<p style="font-weight: 600; color: #007bff; padding: 20px 0;">Analyzing worldwide database drawings in the cloud...</p>`;

        // Convert the clean local array numbers into a flat parameter string
        const numbersQuery = recognizedNumbers.join(',');
        
        fetch(`${API_URL}?numbers=${numbersQuery}`)
            .then(response => response.json())
            .then(categories => {
                
                // Calculate total match count across the payload groups
                const totalMatches = categories[6].length + categories[5].length + categories[4].length + categories[3].length;

                if (totalMatches === 0) {
                    alert("No historical draws found with 3, 4, 5, or 6 matching numbers.");
                    resetVerifyBoxToDefault();
                    verifyBox.style.display = 'none';
                    return;
                }

                // Define your static "Lazy Estimate" prize values based on today's averages
                const prizeValues = {
                    6: 20000000, // $20 Million
                    5: 10000,    // $10k
                    4: 100,      // $100
                    3: 10        // $10
                };

                let totalEstimatedGains = 0;

                // Loop through to calculate the total lazy prize money
                for (let matchNum = 6; matchNum >= 3; matchNum--) {
                    const draws = categories[matchNum];
                    if (draws && draws.length > 0) {
                        totalEstimatedGains += draws.length * prizeValues[matchNum];
                    }
                }

                // Format the total as a clean currency string (e.g., $20,010,430)
                const formattedGains = new Intl.NumberFormat('en-US', {
                    style: 'currency',
                    currency: 'USD',
                    maximumFractionDigits: 0
                }).format(totalEstimatedGains);

                // Build out the display panels dynamically from cloud payload
                let resultsHTML = `
                    <div style="text-align: left; max-height: 450px; overflow-y: auto; padding-right: 10px;">
                        
                        <h3 style="margin-top: 0; color: #333; text-align: center; border-bottom: 2px solid #ddd; padding-bottom: 10px;">
                            Search Results (${totalMatches} Matches)
                        </h3>

                        <div style="background-color: #fff3cd; border: 1px solid #ffeeba; border-radius: 10px; padding: 15px; margin-bottom: 15px; text-align: center;">
                            <span style="font-size: 0.85rem; font-weight: bold; color: #856404; text-transform: uppercase; display: block; margin-bottom: 5px;">
                                ⚠️ Lazy Estimate Breakdown
                            </span>
                            <span style="font-size: 1.8rem; font-weight: 800; color: #28a745; display: block; margin-bottom: 8px;">
                                ${formattedGains}
                            </span>
                            <p style="font-size: 0.8rem; color: #665114; margin: 0; line-height: 1.4; font-style: italic;">
                                This amount is a purely modern valuation to estimate potential gains. Because these historical drawings span different countries, time periods, and currencies, actual historical payouts varied significantly. Use the official links below to view actual historical prize declarations.
                            </p>
                        </div>
                `;

                // Handle sequential validation blocks from 6 matches down to 3
                for (let matchNum = 6; matchNum >= 3; matchNum--) {
                    const draws = categories[matchNum];
                    if (draws && draws.length > 0) {
                        resultsHTML += `
                            <div style="margin-top: 15px; margin-bottom: 10px;">
                                <h4 style="background-color: ${getTierColor(matchNum)}; color: white; padding: 6px 12px; border-radius: 6px; margin: 0 0 10px 0; font-size: 1rem;">
                                    ${matchNum} Numbers Match (${draws.length} ${draws.length === 1 ? 'draw' : 'draws'}) — $${prizeValues[matchNum].toLocaleString()} each
                                </h4>
                                <ul style="list-style: none; padding: 0; margin: 0;">
                        `;

                        draws.forEach(draw => {
                            resultsHTML += `
                                <li style="padding: 10px; border-bottom: 1px solid #eee; font-size: 0.9rem; line-height: 1.4;">
                                    <strong>${draw.game}</strong> (ID: ${draw.id}) - <em>${draw.date}</em><br/>
                                    <span style="color: #555;">Numbers: ${draw.numbers.join(', ')} ${draw.bonus.length ? `[Bonus: ${draw.bonus.join(', ')}]` : ''}</span><br/>
                                    <a href="${draw.url}" target="_blank" style="color: #007bff; text-decoration: none; font-size: 0.8rem; font-weight: 600;">
                                        Go to Official Page to check actual prizes &rarr;
                                    </a>
                                </li>
                            `;
                        });

                        resultsHTML += `
                                </ul>
                            </div>
                        `;
                    }
                }

                resultsHTML += `
                    </div>
                    <button id="close-results-btn" style="margin-top: 20px; background-color: #6c757d; width: 100%;">Close Results</button>
                `;

                // Swap loading screen with the rendered template lists
                verifyBox.innerHTML = resultsHTML;

                document.getElementById('close-results-btn').onclick = () => {
                    resetVerifyBoxToDefault();
                    verifyBox.style.display = 'none';
                };
            })
            .catch(err => {
                console.error("Error connected to remote analytics service:", err);
                alert("Failed to connect to the secure lottery data pipeline.");
                resetVerifyBoxToDefault();
            });
    };

    // Helper engine colors for layout levels
    function getTierColor(matches) {
        switch(matches) {
            case 6: return '#28a745'; 
            case 5: return '#ffc107'; 
            case 4: return '#fd7e14'; 
            case 3: return '#17a2b8'; 
            default: return '#007bff';
        }
    }

    // Explicit binding helper to handle component rewrites
    function bindChoiceButtons() {
        const currentYesBtn = document.getElementById('yes-btn');
        const currentNoBtn = document.getElementById('no-btn');
        
        if (currentYesBtn) currentYesBtn.onclick = handleYesClick;
        if (currentNoBtn) currentNoBtn.onclick = () => { verifyBox.style.display = 'none'; outputText.focus(); };
    }

    // Run initial controller configurations
    bindChoiceButtons();

    clearBtn.onclick = () => { 
        outputText.value = ''; 
        finalTranscript = ''; 
        resetVerifyBoxToDefault();
        verifyBox.style.display = 'none'; 
    };

    updateButtonLabels();
</script>

</body>
</html>
