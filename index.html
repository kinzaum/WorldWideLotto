<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Line Voice Input</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 600px;
        }
        .controls {
            margin-bottom: 1rem;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        button {
            padding: 12px 20px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        #start-btn { background-color: #28a745; color: white; }
        #clear-btn { background-color: #6c757d; color: white; }
        
        button:active { transform: scale(0.98); }
        button.listening { background-color: #dc3545; animation: pulse 1.5s infinite; }

        textarea {
            width: 100%;
            height: 200px; /* Bigger area for multiple lines */
            padding: 15px;
            font-size: 1.1rem;
            border: 2px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
            resize: vertical; /* Let the user resize if they want */
            font-family: inherit;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Worldwide Lottery Checker</h2>
    <div class="controls">
        <button id="start-btn">Start Listening</button>
        <button id="clear-btn">Clear Text</button>
    </div>
    <textarea id="output-text" placeholder="Speak your numbers..."></textarea>
</div>

<script>
    const startBtn = document.getElementById('start-btn');
    const clearBtn = document.getElementById('clear-btn');
    const outputText = document.getElementById('output-text');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
        const recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = false; // Only append when it's sure
        recognition.lang = 'en-US';

        let isListening = false;

        startBtn.addEventListener('click', () => {
            if (!isListening) {
                recognition.start();
            } else {
                recognition.stop();
            }
        });

        clearBtn.addEventListener('click', () => {
            outputText.value = '';
        });

        recognition.onstart = () => {
            isListening = true;
            startBtn.textContent = 'Stop Listening';
            startBtn.classList.add('listening');
        };

        recognition.onend = () => {
            isListening = false;
            startBtn.textContent = 'Start Listening';
            startBtn.classList.remove('listening');
        };

        recognition.onresult = (event) => {
            let currentTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    currentTranscript += event.results[i][0].transcript;
                }
            }
            
            if (currentTranscript) {
                // Append the new text to the existing text + a space
                outputText.value += currentTranscript.trim() + " ";
                // Automatically scroll to the bottom so the new text is visible
                outputText.scrollTop = outputText.scrollHeight;
            }
        };

    } else {
        alert("Web Speech API not supported.");
    }
</script>

</body>
</html>
